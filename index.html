<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOCABULARY QUEST</title>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

<style>
body {
    margin:0;
    min-height:100svh;
    overflow:hidden;
    background:#020611;
    color:white;
    font-family:'Baloo 2', sans-serif;
}

    /* ボタンが光る演出 */
@keyframes button-glow {
    0% { 
        box-shadow: 0 0 10px #5ee7ff, inset 0 0 0px #fff;
        transform: scale(1);
    }
    50% { 
        box-shadow: 0 0 40px #5ee7ff, inset 0 0 20px #fff;
        transform: scale(0.98);
        background: #4fd8ff;
    }
    100% { 
        box-shadow: 0 0 12px #5ee7ff, inset 0 0 10px rgba(94,231,255,0.2);
        transform: scale(1);
    }
}

.btn-flash {
    animation: button-glow 0.4s ease-out;
}
#game-container {
    width:100vw;
    height:100svh;
}

.screen {
    display:none;
    width:100%;
    height:100%;
    box-sizing:border-box;
    padding:20px 14px;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:
        linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.85)),
        url('title-bg.png');
    background-size:cover;
    background-position:center;
}

.screen.active {
    display:flex;
}

h1 {
    font-family:'Orbitron', sans-serif;
    font-size:clamp(2rem, 9vw, 3rem);
    color:#8fdcff;
    letter-spacing:3px;
    line-height:1.15;
    margin:16px 0 28px;
    text-shadow:
        0 0 6px #4fd8ff,
        0 0 14px #4fd8ff,
        0 0 30px #008cff;
}

button {
    width:min(82vw, 360px);
    margin:10px;
    padding:14px 20px;
    font-size:clamp(1.2rem, 5vw, 1.7rem);
    border-radius:16px;
    border:2px solid #5ee7ff;
    background:linear-gradient(180deg,#1b4b7a,#081a33);
    color:#c9f4ff;
    font-weight:bold;
    cursor:pointer;
    text-shadow:0 0 8px #5ee7ff;
    box-shadow:0 0 12px #5ee7ff, inset 0 0 10px rgba(94,231,255,0.2);
}

#question {
    font-size:clamp(2.2rem, 12vw, 4rem);
    margin:10px 0 18px;
    line-height:1.1;
    max-width:92vw;
    word-break:break-word;
    text-shadow:0 0 10px #fff,0 0 30px #58d7ff;
}

#choices {
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.choice-btn {
    width:min(88vw, 520px);
    max-width:520px;
    padding:13px 16px;
    font-size:clamp(1.1rem, 4.8vw, 1.55rem);
    margin:8px 0;
}

#progress {
    color:#8fdcff;
    font-size:1.1rem;
    text-shadow:0 0 12px #58d7ff;
    margin-bottom:8px;
}

#result-score {
    font-size:clamp(3rem, 14vw, 4.5rem);
    text-shadow:0 0 20px #5ee7ff;
}

#error-message {
    color:#ff8080;
    font-size:1rem;
    max-width:90%;
}
</style>
</head>

<body>

<audio id="title-bgm" src="titlebgm.mp3" loop preload="auto"></audio>
<audio id="game-bgm" src="bgm.mp3" loop preload="auto"></audio>

<audio class="correct-sound" src="correct.mp3" preload="auto"></audio>
<audio class="wrong-sound" src="wrong.mp3" preload="auto"></audio>

<div id="game-container">

    <div id="load-screen" class="screen active">
        <h1>Loading...</h1>
        <div id="error-message"></div>
    </div>

    <div id="title-screen" class="screen">
        <h1>VOCABULARY<br>QUEST</h1>
        <button onclick="startFromTitle()">START</button>
    </div>

    <div id="level-screen" class="screen">
        <h1>Difficulty</h1>
        <button onclick="selectLevel('easy')">Easy</button>
        <button onclick="selectLevel('normal')">Normal</button>
        <button onclick="selectLevel('hard')">Hard</button>
    </div>

    <div id="start-screen" class="screen">
        <h1>Questions</h1>
        <button onclick="startGame(10)">10</button>
        <button onclick="startGame(20)">20</button>
        <button onclick="startGame(30)">30</button>
    </div>

    <div id="quiz-screen" class="screen">
        <div id="progress"></div>
        <div id="question"></div>
        <div id="choices"></div>
    </div>

    <div id="result-screen" class="screen">
        <h1>RESULT</h1>
        <div id="result-score"></div>
        <button onclick="location.reload()">RETRY</button>
    </div>

</div>

<script>
let masterWordList = [];
let filteredList = [];
let gameList = [];
let idx = 0;
let score = 0;

const titleBgm = document.getElementById("title-bgm");
const bgm = document.getElementById("game-bgm");
const correctSounds = document.querySelectorAll(".correct-sound");

function show(id){
    document.querySelectorAll(".screen").forEach(screen => {
        screen.classList.remove("active");
    });
    document.getElementById(id).classList.add("active");
}

async function fetchWords(){
    try {
        const res = await fetch("words.json");

        if (!res.ok) {
            throw new Error("words.json が読み込めません");
        }

        masterWordList = await res.json();

        if (!Array.isArray(masterWordList) || masterWordList.length === 0) {
            throw new Error("words.json の中身が空、または形式が違います");
        }

        show("title-screen");

    } catch(e) {
        console.log(e);
        document.getElementById("error-message").innerText =
            "Loading Error: words.json を確認してください。";
    }
}

// ボタンを押した時の効果音（とりあえず空の関数を作成）
function playMysticSound() {
    console.log("Sound played!"); 
    // ここに将来的に音を鳴らす処理を書けばOK
}

// ボタンを光らせる演出の関数
function animateButton(btn) {
    if (!btn) return;
    btn.classList.add("btn-flash");
    setTimeout(() => {
        btn.classList.remove("btn-flash");
    }, 400);
}

    
let audioCtx = null;

function startFromTitle(){
    playMysticSound(); // 音を追加
    const btn = event.currentTarget; // 押されたボタン
    animateButton(btn); // 光を追加

    titleBgm.volume = 0.5;
    titleBgm.currentTime = 0;
    titleBgm.play().catch(e => console.log("title bgm error:", e));

    setTimeout(() => show("level-screen"), 400); // 演出が終わる頃に画面遷移
}

function selectLevel(level){
    playMysticSound(); // 音を追加
    animateButton(event.currentTarget); // 光を追加

    filteredList = masterWordList.filter(w => w.level === level);
    if (filteredList.length === 0) filteredList = masterWordList;

    setTimeout(() => show("start-screen"), 400);
}

function startGame(num){
    playMysticSound(); // 音を追加
    animateButton(event.currentTarget); // 光を追加

    titleBgm.pause();
    titleBgm.currentTime = 0;

    bgm.volume = 0.4;
    bgm.currentTime = 0;
    bgm.play().catch(e => console.log("game bgm error:", e));

    gameList = [...filteredList].sort(() => Math.random() - 0.5).slice(0, num);
    idx = 0; score = 0;

    setTimeout(() => {
        show("quiz-screen");
        next();
    }, 400);
}

function next(){
    const q = gameList[idx];

    document.getElementById("progress").innerText =
        `${idx + 1} / ${gameList.length}`;

    document.getElementById("question").innerText = q.j;

    const choices = document.getElementById("choices");
    choices.innerHTML = "";

    const wrong = masterWordList
        .filter(w => w.e !== q.e)
        .sort(() => Math.random() - 0.5)
        .slice(0, 3)
        .map(w => w.e);

    const allChoices = [...wrong, q.e].sort(() => Math.random() - 0.5);

    allChoices.forEach(choice => {
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.innerText = choice;
        btn.onclick = () => answer(choice, q.e);
        choices.appendChild(btn);
    });
}

function playRandomCorrectSound(){
    if (correctSounds.length === 0) return;

    const sound = correctSounds[Math.floor(Math.random() * correctSounds.length)];

    sound.pause();
    sound.currentTime = 0;
    sound.volume = 0.9;

    sound.play().catch(e => console.log("correct sound error:", e));
}

function answer(selected, correct){
    if (selected === correct) {
        score++;
        playRandomCorrectSound();
    }

    idx++;

    if (idx < gameList.length) {
        setTimeout(next, 500);
    } else {
        result();
    }
}

function result(){
    bgm.pause();
    bgm.currentTime = 0;

    show("result-screen");
    document.getElementById("result-score").innerText =
        score + " / " + gameList.length;
}

fetchWords();
</script>

</body>
</html>
